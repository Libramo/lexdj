services:

  # PostgreSQL database — replaces Neon
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # Typesense search engine — replaces Typesense Cloud
  typesense:
    image: typesense/typesense:27.1
    restart: always
    environment:
      TYPESENSE_API_KEY: your_typesense_api_key
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense_data:/data
    ports:
      - "127.0.0.1:8108:8108"

  # Your Next.js app
  nextjs:
    build: .
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - typesense

volumes:
  postgres_data:
  typesense_data: